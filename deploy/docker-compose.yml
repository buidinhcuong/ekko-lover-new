# Chạy:  cd deploy && cp ../app/.env.example .env  (điền giá trị) && docker compose up -d --build
services:
  ekko-gdtc:
    build: ../app
    container_name: ekko-gdtc
    restart: unless-stopped
    env_file: .env            # ANTHROPIC_API_KEY, EKKO_ADMIN_SUBJECTS, EKKO_SIGNUP_CODE, EKKO_SESSION_SECRET…
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      EKKO_DATA_DIR: /data
      # Mã phiên bản hiện ở /healthz (image không có .git): EKKO_VERSION=$(git describe --tags) docker compose up -d --build
      EKKO_VERSION: ${EKKO_VERSION:-}
    ports:
      - "127.0.0.1:4321:4321" # chỉ mở cho Nginx/reverse proxy trên cùng máy
    volumes:
      - ekko-data:/data       # database + ảnh hoá đơn — sao lưu volume này
volumes:
  ekko-data:
