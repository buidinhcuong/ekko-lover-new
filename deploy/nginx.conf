# Nginx reverse proxy + HTTPS. Thay hoc-tap.example.vn bằng tên miền thật;
# chứng chỉ lấy bằng certbot (Let's Encrypt) hoặc chứng chỉ của doanh nghiệp.
server {
    listen 80;
    server_name hoc-tap.example.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hoc-tap.example.vn;

    ssl_certificate     /etc/letsencrypt/live/hoc-tap.example.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoc-tap.example.vn/privkey.pem;

    # Ảnh hoá đơn gửi lên dạng base64 trong JSON (server tự chặn ở 2 MB)
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Giới hạn số lần thử đăng nhập theo IP dựa vào header này
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gọi AI có thể mất vài giây
        proxy_read_timeout 60s;
    }
}
